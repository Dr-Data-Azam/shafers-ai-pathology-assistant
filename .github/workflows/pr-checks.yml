name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Black + Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting with Black
        run: uv run black --check .

      - name: Lint with Ruff
        run: uv run ruff check .

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Export locked requirements for audit
        run: uv export --frozen --no-dev --format requirements-txt -o /tmp/requirements-audit.txt

      - name: Run pip-audit
        run: uvx pip-audit -r /tmp/requirements-audit.txt
